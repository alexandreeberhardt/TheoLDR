[project]
name = "theoldr"
version = "0.1.0"
description = "Raccourcit les vidéos de Theo uniquement par coupes (TLDR et TTLDR)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
theoldr = "theoldr.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
