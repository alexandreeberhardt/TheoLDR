[project]
name = "theoldr"
version = "0.1.0"
description = "Shortens Theo's videos by cutting only (TLDR and TTLDR)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
theoldr = "theoldr.cli:main"

[project.optional-dependencies]
qa = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; (sys_platform != 'darwin' or platform_machine != 'arm64') and platform_machine != 'ARM64'",
]

[tool.uv]
# Intel Macs: pick versions of the faster-whisper dependencies that still ship a wheel for them.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
